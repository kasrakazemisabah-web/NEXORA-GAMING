
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXORA | Gaming Hub</title>
<style>
/* NEXORA MOBILE VERSION */
@media (max-width: 768px) {
  body {
    overflow-x: hidden;
  }

  header {
    padding: 15px;
    flex-direction: column;
    gap: 15px;
  }

  .logo {
    font-size: 27px;
  }

  nav {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
  }

  nav a {
    margin: 5px;
    font-size: 14px;
  }

  .hero {
    padding: 55px 15px;
  }

  .hero h1 {
    font-size: 30px;
  }

  .hero p {
    font-size: 14px;
    line-height: 2;
  }

  .container {
    padding: 25px 14px;
  }

  .section-title {
    font-size: 22px;
  }

  .search {
    width: 100%;
    font-size: 14px;
  }

  .filters {
    gap: 8px;
  }

  .filters button {
    flex: 1 1 auto;
    padding: 10px;
  }

  .games {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }

  .game img {
    height: 105px;
  }

  .info {
    padding: 10px;
  }

  .info h3 {
    font-size: 13px;
    line-height: 1.7;
  }

  .info a {
    font-size: 12px;
    padding: 10px 5px;
  }
}

@media (max-width: 380px) {
  .games {
    grid-template-columns: 1fr;
  }

  .game img {
    height: 160px;
  }
}
</style>
</head>
<body>

<header>
<div class="logo">NEXORA</div>
<nav>
<a href="#">خانه</a>
<a href="#games">بازی‌ها</a>
<a href="#about">درباره ما</a>
</nav>
</header>

<section class="hero">
<h1>WELCOME TO <span>NEXORA</span></h1>
<p>دنیای بازی‌ها فقط با یک کلیک فاصله دارد!</p>
<a href="#games" class="btn">مشاهده بازی‌ها</a>
</section>

<main class="container" id="games">
<h2 class="section-title">🎮 آرشیو بازی‌ها</h2>
<input id="search" class="search" placeholder="اسم بازی رو جستجو کن..." oninput="render()">
<div class="filters" id="filters"></div>
<div class="games" id="gamesList"></div>
</main>

<section class="container" id="about">
<h2 class="section-title">درباره NEXORA</h2>
<p style="color:#bbb;line-height:2">
NEXORA مرکز معرفی بازی‌های کامپیوتری و کنسولی است.
جدیدترین بازی‌ها را کشف کن!
</p>
</section>

<footer>© 2026 NEXORA | طراحی و توسعه: Kasra Kazemi</footer>

<script>
const games=[
["Counter-Strike 2","آنلاین",730],
["PUBG Battlegrounds","آنلاین",578080],
["Dota 2","آنلاین",570],
["Apex Legends","اکشن",1172470],
["GTA V","اکشن",271590],
["Red Dead Redemption 2","ماجراجویی",1174180],
["Cyberpunk 2077","اکشن",1091500],
["Elden Ring","اکشن",1245620],
["The Witcher 3","ماجراجویی",292030],
["Resident Evil 4","ترسناک",2050650],
["Resident Evil Village","ترسناک",1196590],
["Outlast","ترسناک",238320],
["Outlast 2","ترسناک",414700],
["Phasmophobia","ترسناک",739630],
["Dead by Daylight","ترسناک",381210],
["The Forest","ترسناک",242760],
["Sons of the Forest","ترسناک",1326470],
["Minecraft","ماجراجویی",1672970],
["Terraria","ماجراجویی",105600],
["Hogwarts Legacy","ماجراجویی",990080],
["Forza Horizon 5","ورزشی",1551360],
["EA SPORTS FC 25","ورزشی",2669320],
["Rocket League","ورزشی",252950],
["Garry's Mod","آنلاین",4000],
["Rust","آنلاین",252490],
["Rainbow Six Siege","اکشن",359550],
["DOOM Eternal","اکشن",782330],
["God of War","اکشن",1593500],
["Hollow Knight","ماجراجویی",367520],
["Subnautica","ماجراجویی",264710]
];

const categories=["همه","اکشن","ترسناک","ماجراجویی","ورزشی","آنلاین"];
let selected="همه";

function makeFilters(){
document.getElementById("filters").innerHTML=categories.map(c=>
`<button class="${selected===c?'active':''}" onclick="choose('${c}')">${c}</button>`
).join("");
}

function choose(c){
selected=c;
makeFilters();
render();
}

function render(){
const q=document.getElementById("search").value.toLowerCase();

const list=games.filter(g=>
(selected==="همه"||g[1]===selected)&&
g[0].toLowerCase().includes(q)
);

document.getElementById("gamesList").innerHTML=list.map(g=>`
<article class="game">
<img
src="https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/${g[2]}/header.jpg"
alt="${g[0]}"
loading="lazy"
onerror="this.onerror=null;this.src='https://cdn.akamai.steamstatic.com/steam/apps/${g[2]}/header.jpg';this.onerror=function(){this.onerror=null;this.src='https://placehold.co/600x300/17172b/ffffff?text=${encodeURIComponent(g[0])}'}"
>
<div class="info">
<h3>${g[0]}</h3>
<span class="tag">${g[1]}</span>
<a href="https://store.steampowered.com/app/${g[2]}/" target="_blank" rel="noopener">مشاهده بازی</a>
</div>
</article>
`).join("");

if(!list.length){
document.getElementById("gamesList").innerHTML="<p>بازی پیدا نشد!</p>";
}
}

makeFilters();
render();
</script>
</body>
</html>
