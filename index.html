
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXORA | Gaming Hub</title>
<style>
* {
  box-sizing: border-box;
}

:root {
  --purple: #a855f7;
  --blue: #22d3ee;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  overflow-x: hidden;
  background:
    radial-gradient(ellipse at 15% 10%, #251044, transparent 35%),
    radial-gradient(ellipse at 90% 35%, #062b3b, transparent 30%),
    #05050b;
  color: white;
  font-family: Tahoma, Arial, sans-serif;
}

header {
  width: 100%;
  padding: 20px 6%;
  background: #090914;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #22d3ee66;
}

.logo {
  font-size: 30px;
  font-weight: bold;
  color: #d8b4fe;
  letter-spacing: 3px;
  text-shadow: 0 0 12px #a855f7;
}

nav {
  display: flex;
  flex-wrap: wrap;
  gap: 15px;
}

nav a {
  color: white;
  text-decoration: none;
}

nav a:hover {
  color: var(--blue);
}

.hero {
  text-align: center;
  padding: 85px 20px;
  background:
    radial-gradient(ellipse at center top, #6322a8, transparent 65%),
    linear-gradient(135deg, #10091f, #07131f);
}

.hero h1 {
  font-size: clamp(28px, 6vw, 48px);
}

.hero h1 span {
  color: var(--blue);
  text-shadow: 0 0 15px var(--blue);
}

.hero p {
  color: #ccc;
  line-height: 2;
}

.btn {
  display: inline-block;
  margin-top: 20px;
  padding: 14px 28px;
  background: linear-gradient(100deg, #7e22ce, #1d4ed8);
  color: white;
  text-decoration: none;
  border-radius: 10px;
}

.container {
  width: 100%;
  max-width: 1200px;
  margin: auto;
  padding: 35px 20px;
}

.section-title {
  font-size: 26px;
  color: #d8b4fe;
}

.search {
  display: block;
  width: 100%;
  min-width: 0;
  padding: 15px;
  background: #0d1020;
  border: 1px solid #22d3ee66;
  border-radius: 10px;
  color: white;
  font-size: 16px;
  margin-bottom: 20px;
}

.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 25px;
}

.filters button {
  padding: 10px 18px;
  background: #101426;
  color: white;
  border: 1px solid #a855f766;
  border-radius: 8px;
}

.games {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
}

.game {
  min-width: 0;
  overflow: hidden;
  background: linear-gradient(145deg, #171329, #091321);
  border: 1px solid #a855f755;
  border-radius: 13px;
}

.game img {
  display: block;
  width: 100%;
  height: 145px;
  object-fit: cover;
}

.info {
  padding: 15px;
}

.info h3 {
  overflow-wrap: anywhere;
}

.tag {
  color: #67e8f9;
  font-size: 12px;
}

.info a {
  display: block;
  text-align: center;
  background: linear-gradient(100deg, #7e22ce, #1d4ed8);
  color: white;
  padding: 10px;
  border-radius: 7px;
  text-decoration: none;
  margin-top: 15px;
}

footer {
  text-align: center;
  padding: 30px 15px;
  background: #080b16;
  color: #aaa;
  margin-top: 40px;
}

@media (max-width: 768px) {
  header {
    flex-direction: column;
    gap: 15px;
    padding: 18px 12px;
  }

  nav {
    justify-content: center;
    gap: 18px;
  }

  .hero {
    padding: 55px 15px;
  }

  .hero h1 {
    font-size: 29px;
  }

  .container {
    padding: 25px 14px;
  }

  .games {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }

  .game img {
    height: 110px;
  }

  .info {
    padding: 10px;
  }

  .info h3 {
    font-size: 13px;
    line-height: 1.8;
  }

  .info a {
    font-size: 12px;
    padding: 9px 4px;
  }

  .filters button {
    flex: 1 1 auto;
    padding: 10px;
  }
}

@media (max-width: 380px) {
  .games {
    grid-template-columns: 1fr;
  }

  .game img {
    height: 170px;
  }
}
</style>
</head>
<body>

<header>
<div class="logo">NEXORA</div>
<nav>
<a href="#">خانه</a>
<a href="#games">بازی‌ها</a>
<a href="#about">درباره ما</a>
</nav>
</header>

<section class="hero">
<h1>WELCOME TO <span>NEXORA</span></h1>
<p>دنیای بازی‌ها فقط با یک کلیک فاصله دارد!</p>
<a href="#games" class="btn">مشاهده بازی‌ها</a>
</section>

<main class="container" id="games">
<h2 class="section-title">🎮 آرشیو بازی‌ها</h2>
<input id="search" class="search" placeholder="اسم بازی رو جستجو کن..." oninput="render()">
<div class="filters" id="filters"></div>
<div class="games" id="gamesList"></div>
</main>

<section class="container" id="about">
<h2 class="section-title">درباره NEXORA</h2>
<p style="color:#bbb;line-height:2">
NEXORA مرکز معرفی بازی‌های کامپیوتری و کنسولی است.
جدیدترین بازی‌ها را کشف کن!
</p>
</section>

<footer>© 2026 NEXORA | طراحی و توسعه: Kasra Kazemi</footer>

<script>
const games=[
["Counter-Strike 2","آنلاین",730],
["PUBG Battlegrounds","آنلاین",578080],
["Dota 2","آنلاین",570],
["Apex Legends","اکشن",1172470],
["GTA V","اکشن",271590],
["Red Dead Redemption 2","ماجراجویی",1174180],
["Cyberpunk 2077","اکشن",1091500],
["Elden Ring","اکشن",1245620],
["The Witcher 3","ماجراجویی",292030],
["Resident Evil 4","ترسناک",2050650],
["Resident Evil Village","ترسناک",1196590],
["Outlast","ترسناک",238320],
["Outlast 2","ترسناک",414700],
["Phasmophobia","ترسناک",739630],
["Dead by Daylight","ترسناک",381210],
["The Forest","ترسناک",242760],
["Sons of the Forest","ترسناک",1326470],
["Minecraft","ماجراجویی",1672970],
["Terraria","ماجراجویی",105600],
["Hogwarts Legacy","ماجراجویی",990080],
["Forza Horizon 5","ورزشی",1551360],
["EA SPORTS FC 25","ورزشی",2669320],
["Rocket League","ورزشی",252950],
["Garry's Mod","آنلاین",4000],
["Rust","آنلاین",252490],
["Rainbow Six Siege","اکشن",359550],
["DOOM Eternal","اکشن",782330],
["God of War","اکشن",1593500],
["Hollow Knight","ماجراجویی",367520],
["Subnautica","ماجراجویی",264710]
];

const categories=["همه","اکشن","ترسناک","ماجراجویی","ورزشی","آنلاین"];
let selected="همه";

function makeFilters(){
document.getElementById("filters").innerHTML=categories.map(c=>
`<button class="${selected===c?'active':''}" onclick="choose('${c}')">${c}</button>`
).join("");
}

function choose(c){
selected=c;
makeFilters();
render();
}

function render(){
const q=document.getElementById("search").value.toLowerCase();

const list=games.filter(g=>
(selected==="همه"||g[1]===selected)&&
g[0].toLowerCase().includes(q)
);

document.getElementById("gamesList").innerHTML=list.map(g=>`
<article class="game">
<img
src="https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/${g[2]}/header.jpg"
alt="${g[0]}"
loading="lazy"
onerror="this.onerror=null;this.src='https://cdn.akamai.steamstatic.com/steam/apps/${g[2]}/header.jpg';this.onerror=function(){this.onerror=null;this.src='https://placehold.co/600x300/17172b/ffffff?text=${encodeURIComponent(g[0])}'}"
>
<div class="info">
<h3>${g[0]}</h3>
<span class="tag">${g[1]}</span>
<a href="https://store.steampowered.com/app/${g[2]}/" target="_blank" rel="noopener">مشاهده بازی</a>
</div>
</article>
`).join("");

if(!list.length){
document.getElementById("gamesList").innerHTML="<p>بازی پیدا نشد!</p>";
}
}

makeFilters();
render();
</script>
</body>
</html>
